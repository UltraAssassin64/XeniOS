name: CPU tests

# Builds the CPU test programs for macOS on Apple Silicon and runs them, so the
# ARM64 JIT backend (the one the iOS app uses) is exercised natively. The run
# produces a report; failing tests do not fail the job.

on:
  push:
    paths:
      - 'src/xenia/cpu/**'
      - 'src/xenia/base/**'
      - 'tools/ci/**'
      - 'third_party/binutils/**'
      - 'src/xenia/**/premake5.lua'
      - '.github/workflows/cpu-tests.yml'
  workflow_dispatch:

jobs:
  ppc-test-binaries:
    name: Assemble PowerPC instruction tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main

      - name: Cache binutils
        id: cache-binutils
        uses: actions/cache@main
        with:
          path: |
            third_party/binutils/bin
            third_party/binutils/powerpc-none-elf
          key: ${{ runner.os }}-${{ runner.arch }}-binutils-vmx128-${{ hashFiles('third_party/binutils/build.sh', 'third_party/binutils/*.patch') }}

      - name: Build binutils
        if: steps.cache-binutils.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential texinfo flex bison
          cd third_party/binutils
          MAKEFLAGS="-j$(nproc)" bash ./build.sh

      - name: Assemble tests
        run: |
          python3 xenia-build.py gentests
          bin_count="$(find src/xenia/cpu/ppc/testing/bin -name '*.bin' | wc -l)"
          echo "Assembled ${bin_count} test binaries"
          if [ "${bin_count}" -lt 500 ]; then
            echo "::error::Expected more than 500 test binaries"
            exit 1
          fi

      - name: Upload test binaries
        uses: actions/upload-artifact@main
        with:
          name: ppc-test-binaries
          path: |
            src/xenia/cpu/ppc/testing/bin/*.bin
            src/xenia/cpu/ppc/testing/bin/*.map
          if-no-files-found: error
          retention-days: 7

  cpu-tests-macos-arm64:
    name: CPU tests (macOS ARM64)
    needs: ppc-test-binaries
    runs-on: macos-26
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Cache submodules
        id: cache-submodules-cpu-tests
        uses: actions/cache@v3
        with:
          path: |
            third_party
            .git/modules/third_party
          key: ${{ runner.os }}-${{ runner.arch }}-submodules-cputests-v2-${{ hashFiles('.gitmodules') }}-${{ hashFiles('.git/modules/third_party/*/HEAD') }}

      - name: Setup
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ $n -ge 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.3.app' ! -iname '*beta*' | sort -V | tail -n 1)"
          if [ -z "$xcode_app" ]; then
            xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -n 1)"
          fi
          if [ -n "$xcode_app" ]; then
            echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$xcode_app/Contents/Developer"
          fi
          clang++ --version

          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.postBuffer 524288000

          # Only the header and source libraries the CPU code uses.
          retry git submodule update --init --depth=1 \
            third_party/boost_context/context third_party/capstone \
            third_party/catch third_party/cxxopts third_party/date \
            third_party/disruptorplus third_party/fmt third_party/oaknut \
            third_party/tomlplusplus third_party/utfcpp \
            third_party/xbyak third_party/xbyak_aarch64 third_party/xxhash
          git checkout -- third_party/*.lua

      # The test programs are built without the desktop UI, kernel, GPU and
      # audio libraries, which do not all compile for macOS on this branch.
      - name: Build CPU test programs
        id: build_cpu_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/ci/build_cpu_tests.py 2>&1 | tee build-cpu-tests.log

      - name: Download PowerPC test binaries
        uses: actions/download-artifact@main
        with:
          name: ppc-test-binaries
          path: src/xenia/cpu/ppc/testing/bin

      - name: Run tests
        run: |
          python3 tools/ci/run_cpu_tests.py \
            --hir-binary build/cpu-tests/xenia-cpu-tests \
            --ppc-binary build/cpu-tests/xenia-cpu-ppc-tests \
            --out-dir cpu-test-results
          cp build-cpu-tests.log cpu-test-results/ 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: cpu-test-results
          path: cpu-test-results
          if-no-files-found: warn

      - name: Fail if the test programs did not build
        if: steps.build_cpu_tests.outcome != 'success'
        run: |
          echo "::error::The CPU test programs failed to build; see build-cpu-tests.log in the cpu-test-results artifact."
          exit 1
